name: CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - .github/workflows/ci.yml
      - .node-version
      - .nvmrc
      - docs/**
      - eslint.config.mjs
      - example/**
      - integration/**
      - package.json
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
  pull_request:
    branches:
      - main
      - dev
    paths:
      - .github/workflows/ci.yml
      - .node-version
      - .nvmrc
      - docs/**
      - eslint.config.mjs
      - example/**
      - integration/**
      - package.json
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Run CLI tests
        run: pnpm --filter graz test:cli

      - name: Type check
        run: pnpm --filter graz type-check

  build-examples:
    name: Build Examples
    runs-on: ubuntu-24.04
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version: 24.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build graz package
        run: pnpm --filter graz build

      - name: Generate chain definitions
        run: pnpm graz cli --generate

      - name: Build all packages
        run: pnpm build-all
