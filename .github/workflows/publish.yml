name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - dev

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  NODE_VERSION: 24.17.0
  NPM_REGISTRY_URL: https://registry.npmjs.org
  PNPM_VERSION: 11.8.0

jobs:
  release_state:
    name: Check release state
    runs-on: ubuntu-24.04
    outputs:
      has_changesets: ${{ steps.state.outputs.has_changesets }}
      package_name: ${{ steps.state.outputs.package_name }}
      package_version: ${{ steps.state.outputs.package_version }}
      should_publish: ${{ steps.state.outputs.should_publish }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}

      - name: Check package publish state
        id: state
        shell: bash
        run: |
          has_changesets=false
          if [[ -n "$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)" ]]; then
            has_changesets=true
          fi

          package_name="$(node -p "require('./packages/graz/package.json').name")"
          package_version="$(node -p "require('./packages/graz/package.json').version")"

          published=not_checked
          if [[ "${has_changesets}" == "false" ]]; then
            view_output="$(npm view "${package_name}@${package_version}" version --registry "${NPM_REGISTRY_URL}" 2>&1)" && published=true || {
              if grep -q "E404" <<<"${view_output}"; then
                published=false
              else
                echo "${view_output}"
                exit 1
              fi
            }
          fi

          should_publish=false
          if [[ "${has_changesets}" == "false" && "${published}" == "false" ]]; then
            should_publish=true
          fi

          echo "has_changesets=${has_changesets}" >> "${GITHUB_OUTPUT}"
          echo "package_name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "should_publish=${should_publish}" >> "${GITHUB_OUTPUT}"

          echo "has_changesets=${has_changesets}"
          echo "package=${package_name}@${package_version}"
          echo "published=${published}"
          echo "should_publish=${should_publish}"

  version:
    name: Create version PR
    needs: release_state
    if: needs.release_state.outputs.has_changesets == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  publish:
    name: Publish to npm
    needs: release_state
    if: needs.release_state.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}

      - name: Verify npm trusted publishing support
        shell: bash
        run: |
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          node -e "const v = process.argv[1].split('.').map(Number); if (v[0] < 11 || (v[0] === 11 && v[1] < 5) || (v[0] === 11 && v[1] === 5 && v[2] < 1)) process.exit(1)" "${npm_version}"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ github.token }}
