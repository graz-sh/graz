packages:
  - "docs/"
  - "example/*"
  - "integration/*"
  - "packages/*"

publicHoistPattern:
  - "*"
preferWorkspacePackages: true
publishBranch: dev
saveExact: true
useNodeVersion: 24.17.0

allowBuilds:
  bufferutil: true
  core-js: true
  es5-ext: true
  esbuild: true
  keccak: true
  protobufjs: true
  sharp: true
  tiny-secp256k1: true
  unrs-resolver: true
  utf-8-validate: true

peerDependencyRules:
  allowedVersions:
    "@safe-global/types-kit": ">=3.0.0 <4.0.0"
    "@solana/sysvars": ">=2.1.0 <6.0.0"
    cosmjs-types: ">=0.9.0 <0.12.0"
    typescript: ">=5.0.0 <7.0.0"
    utf-8-validate: ">=5.0.2 <7.0.0"
    ws: ">=7.5.11 <9.0.0"

